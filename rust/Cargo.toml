[package]
name = "aoc"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = "0.7"
bitvec = "1"
clap = "4"
colored = "3"
dhat = "0.3"
hotpath = "0.7"
libc = "0.2"
pprof = "0.15"
ratatui = "0.29"
rayon = "1"
rustc-hash = "2"
smallvec = "1"
thiserror = "2"

[dev-dependencies]
divan = "0.1"
criterion = "0.8"

[profile.release]
codegen-units = 1
lto = true

[profile.bench]
codegen-units = 1
lto = true

[[bench]]
name = "bench"
harness = false
